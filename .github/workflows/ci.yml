name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  translations:
    name: Translations are complete and generated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The generator refuses to run if a key or placeholder is missing.
      - run: node tools/i18n_build.mjs
      # Generated files must be committed together with the JSON they come from.
      - run: git diff --ignore-cr-at-eol --exit-code -- windows/app/ui/i18n.js android/app/src/main/res

  windows:
    name: Windows (Rust core + desktop app)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: cargo fmt --all -- --check
      - run: cargo test -p comic-receiver
      - run: cargo build -p comic-app

  android:
    name: Android (tests + debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: comic-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
