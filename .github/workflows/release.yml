name: Release

# Push a tag like v0.1.0 and this builds both apps and attaches them to a
# GitHub Release. No signing keys live in the repository: if the secrets below
# are set, the APK is a signed release build; if not, a debug APK is attached
# instead, which still installs fine for testing.
#
# Secrets (Settings > Secrets and variables > Actions), all optional:
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Signed release APK
        if: env.KEYSTORE_B64 != ''
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out "$GITHUB_WORKSPACE/CoMic-${GITHUB_REF_NAME}.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          rm "$RUNNER_TEMP/release.jks"

      - name: Debug APK (no signing secrets set)
        if: env.KEYSTORE_B64 == ''
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CoMic-${GITHUB_REF_NAME}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: CoMic-*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: Build
        working-directory: windows
        run: cargo build --release -p comic-app
      - name: Collect
        shell: bash
        run: cp windows/target/release/comic-app.exe "CoMic-${GITHUB_REF_NAME}-windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: CoMic-*.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            CoMic-*.apk
            CoMic-*.exe
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
