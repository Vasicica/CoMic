name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
      placeholder: Samsung A52, Android 14
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: How did you connect?
      options:
        - Wi-Fi, found automatically
        - Wi-Fi, typed address
        - USB tethering
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CoMic version
      placeholder: v0.1.0
  - type: textarea
    id: diag
    attributes:
      label: Diagnostics (if no sound arrives)
      description: Output of `cargo run -- --list-devices` and `cargo run -- --check-firewall` from the windows/ folder.
      render: text
